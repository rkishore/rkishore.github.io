<svg width="720" height="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 720 272" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect x="0" y="0" width="720" height="272" fill="#ffffff"/>
  <title>Comparison of FP32, FP16 and BF16 showing how each divides its bits between range and precision</title>
  <desc>FP32 uses 4 bytes with wide range and very wide precision. FP16 uses 2 bytes and shrinks range, so tiny numbers vanish. BF16 uses 2 bytes but keeps FP32's range, shrinking precision instead.</desc>
  <text x="24" y="26" font-size="12" fill="#4d4a44">Every number format spends its bits on two things: reach and fineness</text>
  <text x="132" y="86" font-size="12" text-anchor="end" fill="#1f1e1b">FP32</text>
  <rect x="150" y="64" width="15" height="32" fill="#faf9f6" stroke="#e4e0d8"/>
  <rect x="165" y="64" width="120" height="32" fill="#fdf1e7" stroke="#b3541e"/>
  <rect x="285" y="64" width="345" height="32" fill="#ffffff" stroke="#e4e0d8"/>
  <text x="225" y="85" font-size="11" text-anchor="middle" fill="#b3541e">range</text>
  <text x="457" y="85" font-size="11" text-anchor="middle" fill="#4d4a44">precision</text>
  <text x="640" y="85" font-size="10" fill="#8b877e">4 bytes</text>
  <text x="150" y="112" font-size="10" fill="#8b877e">The reference. Plenty of both, but twice the memory and slower.</text>
  <text x="132" y="156" font-size="12" text-anchor="end" fill="#1f1e1b">FP16</text>
  <rect x="150" y="134" width="15" height="32" fill="#faf9f6" stroke="#e4e0d8"/>
  <rect x="165" y="134" width="75" height="32" fill="#fdf1e7" stroke="#b3541e"/>
  <rect x="240" y="134" width="150" height="32" fill="#ffffff" stroke="#e4e0d8"/>
  <text x="202" y="155" font-size="10" text-anchor="middle" fill="#b3541e">range</text>
  <text x="315" y="155" font-size="11" text-anchor="middle" fill="#4d4a44">precision</text>
  <text x="400" y="155" font-size="10" fill="#8b877e">2 bytes</text>
  <text x="150" y="182" font-size="10" fill="#8b877e">Range got cut. Very small numbers collapse to zero, very large ones overflow.</text>
  <text x="132" y="226" font-size="12" text-anchor="end" fill="#1f1e1b">BF16</text>
  <rect x="150" y="204" width="15" height="32" fill="#faf9f6" stroke="#e4e0d8"/>
  <rect x="165" y="204" width="120" height="32" fill="#fdf1e7" stroke="#b3541e"/>
  <rect x="285" y="204" width="105" height="32" fill="#ffffff" stroke="#e4e0d8"/>
  <text x="225" y="225" font-size="11" text-anchor="middle" fill="#b3541e">range</text>
  <text x="337" y="225" font-size="10" text-anchor="middle" fill="#4d4a44">precision</text>
  <text x="400" y="225" font-size="10" fill="#8b877e">2 bytes</text>
  <text x="150" y="252" font-size="10" fill="#8b877e">Same reach as FP32, coarser steps. Half the memory, no fragility.</text>
</svg>
