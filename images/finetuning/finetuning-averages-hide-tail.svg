<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A mean accuracy of 0.72 hides a 0.2 on a treatment question; for safety-critical work the tail is the story, not the average</title>
  <desc>A row of per-example accuracy scores plotted as dots along a scale from 0 to 1. Most dots cluster high, between 0.7 and 0.9. One dot sits far out at 0.2 — a wrong first-line treatment answer. A vertical line marks the mean at 0.72, which sits comfortably in the healthy cluster and gives no hint of the outlier. The caption: the average describes a system that is usually fine; the single 0.2 is exactly the shape of a system that hurts someone occasionally. For anything safety-critical, inspect the tail per example, not the mean.</desc>

  <rect x="0" y="0" width="760" height="320" fill="#ffffff"/>

  <style>
    .h    { font-size: 17px; font-weight: 700; fill: #1f1e1b; }
    .axis { font-size: 11px; fill: #8b877e; }
    .mean { font-size: 12px; font-weight: 700; fill: #4d4a44; }
    .bad  { font-size: 12px; font-weight: 700; fill: #b3541e; }
    .cap  { font-size: 12px; fill: #4d4a44; }
  </style>

  <text x="24" y="34" class="h">Averages hide the miss that matters</text>

  <!-- scale -->
  <line x1="60" y1="150" x2="720" y2="150" stroke="#cfcabf" stroke-width="1.5"/>
  <g class="axis" text-anchor="middle" fill="#8b877e">
    <text x="60" y="176">0.0</text><text x="720" y="176">1.0</text>
  </g>
  <g stroke="#e4e0d8"><line x1="60" y1="145" x2="60" y2="155"/><line x1="390" y1="145" x2="390" y2="155"/><line x1="720" y1="145" x2="720" y2="155"/></g>
  <text x="390" y="176" text-anchor="middle" class="axis">0.5</text>

  <!-- healthy cluster dots (0.7-0.9) -->
  <g fill="#8b877e">
    <circle cx="520" cy="150" r="6"/><circle cx="548" cy="150" r="6"/><circle cx="565" cy="150" r="6"/>
    <circle cx="585" cy="150" r="6"/><circle cx="600" cy="150" r="6"/><circle cx="612" cy="150" r="6"/>
    <circle cx="628" cy="150" r="6"/><circle cx="645" cy="150" r="6"/><circle cx="505" cy="150" r="6"/>
    <circle cx="660" cy="150" r="6"/><circle cx="576" cy="150" r="6"/><circle cx="636" cy="150" r="6"/>
  </g>

  <!-- the outlier -->
  <circle cx="192" cy="150" r="8" fill="#b3541e"/>
  <text x="192" y="120" text-anchor="middle" class="bad">0.2</text>
  <text x="192" y="104" text-anchor="middle" class="bad">wrong first-line treatment</text>
  <line x1="192" y1="128" x2="192" y2="142" stroke="#b3541e" stroke-width="1.4"/>

  <!-- mean marker -->
  <line x1="535" y1="118" x2="535" y2="182" stroke="#4d4a44" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="535" y="210" text-anchor="middle" class="mean">mean = 0.72</text>
  <text x="535" y="226" text-anchor="middle" class="axis">sits inside the healthy cluster</text>

  <text x="24" y="270" class="cap">The mean says "usually fine." The single <tspan font-weight="700" fill="#b3541e">0.2</tspan> is the shape of a system that hurts someone <tspan font-style="italic">occasionally</tspan>.</text>
  <text x="24" y="292" class="cap">For anything safety-critical, the <tspan font-weight="700" fill="#1f1e1b">tail is the story</tspan> &#8212; inspect per example, don't trust the average.</text>
</svg>
