<svg width="720" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <title>A rank-one matrix shown as a multiplication table built from 4 numbers down the side and 4 across the top</title>
  <desc>Four numbers 2, 1, 3, 1 run down the left edge and four numbers 1, 0, 2, 3 run across the top. The 16 interior cells are their products. Every interior row is the top row rescaled by the number on its left.</desc>
  <text x="24" y="28" font-size="12" fill="#4d4a44">A rank-1 edit is a times table</text>
  <text x="248" y="52" font-size="10" text-anchor="middle" fill="#b3541e">4 numbers from A</text>
  <rect x="180" y="64" width="40" height="40" rx="5" fill="#faf9f6" stroke="#e4e0d8"/>
  <text x="200" y="90" font-size="13" text-anchor="middle" fill="#8b877e">×</text>
  <g fill="#fdf1e7" stroke="#b3541e">
    <rect x="228" y="64" width="40" height="40" rx="5"/><rect x="272" y="64" width="40" height="40" rx="5"/><rect x="316" y="64" width="40" height="40" rx="5"/><rect x="360" y="64" width="40" height="40" rx="5"/>
    <rect x="180" y="108" width="40" height="40" rx="5"/><rect x="180" y="152" width="40" height="40" rx="5"/><rect x="180" y="196" width="40" height="40" rx="5"/><rect x="180" y="240" width="40" height="40" rx="5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#b3541e">
    <text x="248" y="90">1</text><text x="292" y="90">0</text><text x="336" y="90">2</text><text x="380" y="90">3</text>
    <text x="200" y="134">2</text><text x="200" y="178">1</text><text x="200" y="222">3</text><text x="200" y="266">1</text>
  </g>
  <text x="150" y="178" font-size="10" text-anchor="end" fill="#b3541e">4 numbers</text>
  <text x="150" y="192" font-size="10" text-anchor="end" fill="#b3541e">from B</text>
  <g fill="#ffffff" stroke="#e4e0d8">
    <rect x="228" y="108" width="40" height="40" rx="5"/><rect x="272" y="108" width="40" height="40" rx="5"/><rect x="316" y="108" width="40" height="40" rx="5"/><rect x="360" y="108" width="40" height="40" rx="5"/>
    <rect x="228" y="152" width="40" height="40" rx="5"/><rect x="272" y="152" width="40" height="40" rx="5"/><rect x="316" y="152" width="40" height="40" rx="5"/><rect x="360" y="152" width="40" height="40" rx="5"/>
    <rect x="228" y="196" width="40" height="40" rx="5"/><rect x="272" y="196" width="40" height="40" rx="5"/><rect x="316" y="196" width="40" height="40" rx="5"/><rect x="360" y="196" width="40" height="40" rx="5"/>
    <rect x="228" y="240" width="40" height="40" rx="5"/><rect x="272" y="240" width="40" height="40" rx="5"/><rect x="316" y="240" width="40" height="40" rx="5"/><rect x="360" y="240" width="40" height="40" rx="5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1f1e1b">
    <text x="248" y="134">2</text><text x="292" y="134">0</text><text x="336" y="134">4</text><text x="380" y="134">6</text>
    <text x="248" y="178">1</text><text x="292" y="178">0</text><text x="336" y="178">2</text><text x="380" y="178">3</text>
    <text x="248" y="222">3</text><text x="292" y="222">0</text><text x="336" y="222">6</text><text x="380" y="222">9</text>
    <text x="248" y="266">1</text><text x="292" y="266">0</text><text x="336" y="266">2</text><text x="380" y="266">3</text>
  </g>
  <g font-size="10" fill="#8b877e">
    <text x="416" y="132">← the top row, doubled</text>
    <text x="416" y="176">← the top row, as-is</text>
    <text x="416" y="220">← the top row, tripled</text>
    <text x="416" y="264">← the top row, as-is</text>
  </g>
  <text x="24" y="310" font-size="11" fill="#8b877e">8 numbers on the edges generate all 16 inside. In a real layer: 4096 + 4096 = 8,192 edge numbers generate 16.8M.</text>
</svg>
