<svg width="720" height="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 720 292" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect x="0" y="0" width="720" height="292" fill="#ffffff"/>
  <title>The backward pass travels through every frozen weight matrix but only produces updates for the adapters</title>
  <desc>Three layers each contain a frozen W and a trainable A and B pair. The forward pass moves left to right into the loss. The backward pass returns right to left along the full depth, branching upward into each layer's adapters, while W is only read in order to pass the signal along.</desc>
  <text x="24" y="26" font-size="12" fill="#4d4a44">“Frozen” means not updated — not uninvolved</text>
  <defs>
    <marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a5a096"/>
    </marker>
    <marker id="bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3541e"/>
    </marker>
  </defs>
  <g fill="none" stroke="#e4e0d8">
    <rect x="70" y="60" width="130" height="70" rx="7"/><rect x="230" y="60" width="130" height="70" rx="7"/><rect x="390" y="60" width="130" height="70" rx="7"/>
  </g>
  <g font-size="9" fill="#8b877e"><text x="78" y="76">layer 1</text><text x="238" y="76">layer 2</text><text x="398" y="76">layer 3</text></g>
  <g fill="#faf9f6" stroke="#cfcabf" stroke-dasharray="4 3">
    <rect x="78" y="84" width="60" height="32" rx="5"/><rect x="238" y="84" width="60" height="32" rx="5"/><rect x="398" y="84" width="60" height="32" rx="5"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#4d4a44"><text x="108" y="105">W</text><text x="268" y="105">W</text><text x="428" y="105">W</text></g>
  <g fill="#fdf1e7" stroke="#b3541e">
    <rect x="144" y="84" width="48" height="32" rx="5"/><rect x="304" y="84" width="48" height="32" rx="5"/><rect x="464" y="84" width="48" height="32" rx="5"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#b3541e"><text x="168" y="105">A B</text><text x="328" y="105">A B</text><text x="488" y="105">A B</text></g>
  <rect x="560" y="60" width="90" height="70" rx="7" fill="#ffffff" stroke="#cfcabf"/>
  <text x="605" y="100" font-size="12" text-anchor="middle" fill="#1f1e1b">loss</text>
  <g stroke="#a5a096" fill="none" marker-end="url(#fw)">
    <path d="M 200 95 L 226 95"/><path d="M 360 95 L 386 95"/><path d="M 520 95 L 556 95"/>
  </g>
  <text x="70" y="48" font-size="9" fill="#8b877e">forward →</text>
  <path d="M 605 130 L 605 200" stroke="#b3541e" stroke-dasharray="5 4" fill="none"/>
  <path d="M 650 200 L 70 200" stroke="#b3541e" stroke-dasharray="5 4" fill="none" marker-end="url(#bw)"/>
  <path d="M 605 200 L 650 200" stroke="#b3541e" stroke-dasharray="5 4" fill="none"/>
  <g stroke="#b3541e" stroke-dasharray="5 4" fill="none" marker-end="url(#bw)">
    <path d="M 135 200 L 135 134"/><path d="M 295 200 L 295 134"/><path d="M 455 200 L 455 134"/>
  </g>
  <g font-size="9" fill="#b3541e">
    <text x="143" y="168">updates A, B</text><text x="303" y="168">updates A, B</text><text x="463" y="168">updates A, B</text>
  </g>
  <text x="360" y="222" font-size="10" text-anchor="middle" fill="#b3541e">the error signal has to cross every layer to reach the early adapters</text>
  <text x="24" y="256" font-size="11" fill="#8b877e">Crossing a layer means being multiplied by that layer's W — so W is read on the way back</text>
  <text x="24" y="272" font-size="11" fill="#8b877e">(and in QLoRA, unpacked from NF4 again). What LoRA skips is computing an update for W.</text>
</svg>
