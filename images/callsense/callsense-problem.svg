<svg viewBox="0 0 840 620" width="840" height="620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The call-centre QA problem callsense is built to solve</title>
  <desc>Top: a call centre takes about 5,000 calls a day and a person reviews fewer than 5 percent of them, shown as a grid of 100 dots, each worth 50 calls, with only 4 dots marked as reviewed. Three gaps follow: coverage (95 percent of calls are never reviewed), consistency (two reviewers agree on the same call only 40 to 60 percent of the time) and latency (problems surface days later). Bottom: the job is to turn every call recording, plus caller ID and department, into a speaker-labelled transcript, a structured summary, a QA score over five weighted dimensions, compliance flags and a status. Three constraints make it more than one prompt: anyone on the call can write to the model's prompt, PII must be removed before any language model sees the text, and the score is computed in code, with one critical flag outweighing any average.</desc>

  <rect x="0" y="0" width="840" height="620" fill="#FFFFFF"/>

  <style>
    .title  { font-size: 17px; font-weight: 700; fill: #1A1A18; }
    .sub    { font-size: 12px; fill: #5F5E5A; }
    .lbl    { font-size: 12px; font-weight: 600; }
    .small  { font-size: 11px; fill: #5F5E5A; }
    .big    { font-size: 22px; font-weight: 700; fill: #993C1D; }
    .body   { font-size: 11.5px; }
  </style>

  <!-- ===================== TOP: THE GAP ===================== -->
  <rect x="16" y="16" width="808" height="268" rx="14" fill="#F1EFE8"/>
  <text x="36" y="48" class="title">The gap</text>
  <text x="36" y="67" class="sub">5,000 calls a day; a person hears fewer than 1 in 20</text>

  <!-- 10 x 10 dot grid: 1 dot = 50 calls; 4 reviewed -->
  <g fill="#D3D1C7">
    <circle cx="48" cy="100" r="6"/><circle cx="68" cy="100" r="6"/><circle cx="88" cy="100" r="6"/><circle cx="128" cy="100" r="6"/><circle cx="148" cy="100" r="6"/><circle cx="168" cy="100" r="6"/><circle cx="188" cy="100" r="6"/><circle cx="208" cy="100" r="6"/><circle cx="228" cy="100" r="6"/>
    <circle cx="48" cy="117" r="6"/><circle cx="68" cy="117" r="6"/><circle cx="88" cy="117" r="6"/><circle cx="108" cy="117" r="6"/><circle cx="128" cy="117" r="6"/><circle cx="148" cy="117" r="6"/><circle cx="168" cy="117" r="6"/><circle cx="188" cy="117" r="6"/><circle cx="208" cy="117" r="6"/><circle cx="228" cy="117" r="6"/>
    <circle cx="48" cy="134" r="6"/><circle cx="68" cy="134" r="6"/><circle cx="88" cy="134" r="6"/><circle cx="108" cy="134" r="6"/><circle cx="128" cy="134" r="6"/><circle cx="148" cy="134" r="6"/><circle cx="168" cy="134" r="6"/><circle cx="188" cy="134" r="6"/><circle cx="208" cy="134" r="6"/><circle cx="228" cy="134" r="6"/>
    <circle cx="48" cy="151" r="6"/><circle cx="68" cy="151" r="6"/><circle cx="88" cy="151" r="6"/><circle cx="108" cy="151" r="6"/><circle cx="128" cy="151" r="6"/><circle cx="148" cy="151" r="6"/><circle cx="168" cy="151" r="6"/><circle cx="208" cy="151" r="6"/><circle cx="228" cy="151" r="6"/>
    <circle cx="48" cy="168" r="6"/><circle cx="68" cy="168" r="6"/><circle cx="88" cy="168" r="6"/><circle cx="108" cy="168" r="6"/><circle cx="128" cy="168" r="6"/><circle cx="148" cy="168" r="6"/><circle cx="168" cy="168" r="6"/><circle cx="188" cy="168" r="6"/><circle cx="208" cy="168" r="6"/><circle cx="228" cy="168" r="6"/>
    <circle cx="48" cy="185" r="6"/><circle cx="68" cy="185" r="6"/><circle cx="88" cy="185" r="6"/><circle cx="108" cy="185" r="6"/><circle cx="128" cy="185" r="6"/><circle cx="148" cy="185" r="6"/><circle cx="168" cy="185" r="6"/><circle cx="188" cy="185" r="6"/><circle cx="208" cy="185" r="6"/><circle cx="228" cy="185" r="6"/>
    <circle cx="48" cy="202" r="6"/><circle cx="88" cy="202" r="6"/><circle cx="108" cy="202" r="6"/><circle cx="128" cy="202" r="6"/><circle cx="148" cy="202" r="6"/><circle cx="168" cy="202" r="6"/><circle cx="188" cy="202" r="6"/><circle cx="208" cy="202" r="6"/><circle cx="228" cy="202" r="6"/>
    <circle cx="48" cy="219" r="6"/><circle cx="68" cy="219" r="6"/><circle cx="88" cy="219" r="6"/><circle cx="108" cy="219" r="6"/><circle cx="128" cy="219" r="6"/><circle cx="148" cy="219" r="6"/><circle cx="168" cy="219" r="6"/><circle cx="188" cy="219" r="6"/><circle cx="208" cy="219" r="6"/><circle cx="228" cy="219" r="6"/>
    <circle cx="48" cy="236" r="6"/><circle cx="68" cy="236" r="6"/><circle cx="88" cy="236" r="6"/><circle cx="108" cy="236" r="6"/><circle cx="128" cy="236" r="6"/><circle cx="168" cy="236" r="6"/><circle cx="188" cy="236" r="6"/><circle cx="208" cy="236" r="6"/><circle cx="228" cy="236" r="6"/>
    <circle cx="48" cy="253" r="6"/><circle cx="68" cy="253" r="6"/><circle cx="88" cy="253" r="6"/><circle cx="108" cy="253" r="6"/><circle cx="128" cy="253" r="6"/><circle cx="148" cy="253" r="6"/><circle cx="168" cy="253" r="6"/><circle cx="188" cy="253" r="6"/><circle cx="208" cy="253" r="6"/><circle cx="228" cy="253" r="6"/>
  </g>
  <g fill="#2C6BC4">
    <circle cx="108" cy="100" r="6"/>
    <circle cx="188" cy="151" r="6"/>
    <circle cx="68" cy="202" r="6"/>
    <circle cx="148" cy="236" r="6"/>
  </g>
  <text x="36" y="274" class="small">1 dot = 50 calls ·</text>
  <circle cx="132" cy="270" r="5" fill="#2C6BC4"/>
  <text x="141" y="274" class="small">reviewed by a person</text>

  <!-- three gap cards -->
  <g>
    <rect x="280" y="88" width="524" height="54" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
    <text x="300" y="123" class="big">95%</text>
    <text x="444" y="110" class="lbl" fill="#1A1A18">Coverage</text>
    <text x="444" y="128" class="body" fill="#5F5E5A">of calls never get a quality review</text>

    <rect x="280" y="152" width="524" height="54" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
    <text x="300" y="187" class="big">40–60%</text>
    <text x="444" y="174" class="lbl" fill="#1A1A18">Consistency</text>
    <text x="444" y="192" class="body" fill="#5F5E5A">how often two reviewers agree on the same call</text>

    <rect x="280" y="216" width="524" height="54" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
    <text x="300" y="251" class="big">days</text>
    <text x="444" y="238" class="lbl" fill="#1A1A18">Latency</text>
    <text x="444" y="256" class="body" fill="#5F5E5A">before a problem surfaces, which is too late to coach or correct</text>
  </g>

  <!-- ===================== BOTTOM: THE JOB ===================== -->
  <rect x="16" y="298" width="808" height="306" rx="14" fill="#F1EFE8"/>
  <text x="36" y="330" class="title">The job</text>
  <text x="36" y="349" class="sub">every call, scored the same way, with nothing unsafe reaching a model</text>

  <!-- input -->
  <rect x="40" y="388" width="140" height="72" rx="10" fill="#E6F1FB" stroke="#85B7EB"/>
  <text x="110" y="414" text-anchor="middle" class="lbl" fill="#1F4E79">call recording</text>
  <text x="110" y="432" text-anchor="middle" class="small">WAV · MP3 · FLAC · M4A</text>
  <text x="110" y="448" text-anchor="middle" class="small">+ caller ID, department</text>

  <!-- arrow input -> box -->
  <g stroke="#5F5E5A" stroke-width="1.6" fill="#5F5E5A">
    <line x1="180" y1="424" x2="226" y2="424"/>
    <polygon points="232,424 224,419 224,429" stroke="none"/>
  </g>

  <!-- callsense box -->
  <rect x="234" y="370" width="200" height="108" rx="12" fill="#534AB7" stroke="#3C3489"/>
  <text x="334" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">callsense</text>
  <text x="334" y="440" text-anchor="middle" font-size="11.5" fill="#DCD9F7">one pipeline per call</text>

  <!-- arrow box -> outputs -->
  <g stroke="#5F5E5A" stroke-width="1.6" fill="#5F5E5A">
    <line x1="434" y1="424" x2="470" y2="424"/>
    <line x1="470" y1="376" x2="470" y2="472"/>
    <line x1="470" y1="376" x2="488" y2="376"/>
    <line x1="470" y1="400" x2="488" y2="400"/>
    <line x1="470" y1="424" x2="488" y2="424"/>
    <line x1="470" y1="448" x2="488" y2="448"/>
    <line x1="470" y1="472" x2="488" y2="472"/>
  </g>

  <!-- outputs -->
  <g>
    <rect x="490" y="364" width="314" height="22" rx="11" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="504" y="379" class="body" fill="#0F6E56">speaker-labelled transcript (agent / customer)</text>
    <rect x="490" y="388" width="314" height="22" rx="11" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="504" y="403" class="body" fill="#0F6E56">structured summary: purpose, actions, sentiment</text>
    <rect x="490" y="412" width="314" height="22" rx="11" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="504" y="427" class="body" fill="#0F6E56">QA score over five weighted dimensions</text>
    <rect x="490" y="436" width="314" height="22" rx="11" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="504" y="451" class="body" fill="#0F6E56">compliance flags, each with a severity</text>
    <rect x="490" y="460" width="314" height="22" rx="11" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="504" y="475" class="body" fill="#0F6E56">status: completed / flagged for review / failed</text>
  </g>

  <!-- dashed links: constraints act on the box -->
  <g stroke="#8A8880" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M164 512 L164 498 L274 498 L274 478"/>
    <line x1="334" y1="512" x2="334" y2="478"/>
    <path d="M676 512 L676 498 L394 498 L394 478"/>
  </g>

  <!-- three constraints -->
  <g>
    <rect x="40" y="512" width="248" height="76" rx="10" fill="#FAECE7" stroke="#F0997B"/>
    <text x="56" y="535" class="lbl" fill="#993C1D">1 · The input is untrusted</text>
    <text x="56" y="555" class="body" fill="#5F5E5A">Anyone who speaks on the call</text>
    <text x="56" y="572" class="body" fill="#5F5E5A">can write to the model's prompt.</text>

    <rect x="296" y="512" width="248" height="76" rx="10" fill="#E1F5EE" stroke="#5DCAA5"/>
    <text x="312" y="535" class="lbl" fill="#0F6E56">2 · PII stops at the door</text>
    <text x="312" y="555" class="body" fill="#5F5E5A">Card numbers, SSNs, emails, phones</text>
    <text x="312" y="572" class="body" fill="#5F5E5A">are redacted before any LLM sees them.</text>

    <rect x="552" y="512" width="252" height="76" rx="10" fill="#EEEDFE" stroke="#AFA9EC"/>
    <text x="568" y="535" class="lbl" fill="#3C3489">3 · The score is computed</text>
    <text x="568" y="555" class="body" fill="#5F5E5A">Weights live in code, and one critical</text>
    <text x="568" y="572" class="body" fill="#5F5E5A">flag outweighs any average.</text>
  </g>
</svg>
