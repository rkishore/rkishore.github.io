<svg viewBox="0 0 840 250" width="840" height="250" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What a public demo would cost per month</title>
  <desc>Horizontal bars show the monthly cost of four ways to host the callsense demo, with the effort to set each up beside it. Fly.io is about 3 dollars a month and takes about 20 minutes. Hugging Face PRO is 9 dollars and needs no further work because the Space is already built. AWS Lightsail Containers is 10 dollars and takes about an hour. AWS ECS Fargate with a load balancer is 35 to 40 dollars, by far the longest bar, with the range drawn lighter, and takes half a day.</desc>
  <rect width="840" height="250" fill="#FFFFFF"/>
  <style>
    .title { font-size: 17px; font-weight: 700; fill: #1A1A18; }
    .sub   { font-size: 12px; fill: #5F5E5A; }
    .lbl   { font-size: 12px; font-weight: 600; fill: #1A1A18; }
    .small { font-size: 10.5px; fill: #5F5E5A; }
    .body  { font-size: 11.5px; fill: #1A1A18; }
    .hdr   { font-size: 10.5px; font-weight: 700; }
  </style>
  <text x="24" y="32" class="title">What a public demo would cost per month</text>
  <text x="24" y="51" class="sub">cost at the end of each bar, setup effort at the right</text>
  <line x1="210" y1="66" x2="210" y2="214" stroke="#D3D1C7"/>
  <text x="200" y="93" class="lbl" text-anchor="end">Fly.io</text>
  <rect x="210" y="76" width="24" height="24" fill="#2C6BC4"/>
  <text x="242" y="93" class="lbl">~$3</text>
  <text x="640" y="93" class="small">~20 min</text>
  <text x="200" y="129" class="lbl" text-anchor="end">Hugging Face PRO</text>
  <rect x="210" y="112" width="72" height="24" fill="#2C6BC4"/>
  <text x="290" y="129" class="lbl">$9</text>
  <text x="640" y="129" class="small">none: already built</text>
  <text x="200" y="165" class="lbl" text-anchor="end">AWS Lightsail Containers</text>
  <rect x="210" y="148" width="80" height="24" fill="#2C6BC4"/>
  <text x="298" y="165" class="lbl">$10</text>
  <text x="640" y="165" class="small">~1 hour</text>
  <text x="200" y="201" class="lbl" text-anchor="end">AWS ECS Fargate + ALB</text>
  <rect x="210" y="184" width="280" height="24" fill="#2C6BC4"/>
  <rect x="490" y="184" width="40" height="24" fill="#2C6BC4" fill-opacity="0.4"/>
  <text x="538" y="201" class="lbl">$35–40</text>
  <text x="640" y="201" class="small">half a day</text>
  <text x="24" y="238" class="small">The load balancer costs more than the compute. Whichever host: point the demo at Groq (free tier).</text>
</svg>
