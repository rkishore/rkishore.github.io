<svg viewBox="0 0 840 322" width="840" height="322" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The confidence threshold moved twice</title>
  <desc>Top: a timeline of three pills joined by arrows. On August 5 the threshold was 0.6, a placeholder. On August 6 it became 0.3, the spec's value, on the assumption that the tiny speech model scores low. On August 9 it went back to 0.6, set from measurement. Below: a bar chart of how many of 771 segments from 10 calls fall below each threshold. At 0.3 the bar is empty, 0 segments or 0.0 percent, so the flag never fires and is dead code. At 0.5 it is 12 segments, 1.6 percent. At 0.6 it is 54 segments, 7.0 percent, and eight of ten calls have none while sample_02 has 32 and sample_10 has 22. Confidence ranges from a minimum of 0.412 to a maximum of 0.924, with a mean of 0.750.</desc>
  <rect x="0" y="0" width="840" height="322" fill="#FFFFFF"/>

  <style>
    .title  { font-size: 17px; font-weight: 700; fill: #1A1A18; }
    .sub    { font-size: 12px; fill: #5F5E5A; }
    .lbl    { font-size: 12px; font-weight: 600; fill: #1A1A18; }
    .small  { font-size: 10.5px; fill: #5F5E5A; }
    .body   { font-size: 11.5px; fill: #1A1A18; }
    .bad    { font-size: 10.5px; fill: #993C1D; }
  </style>

  <text x="24" y="32" class="title">The confidence threshold moved twice</text>
  <text x="24" y="51" class="sub">a placeholder, then the spec's value, then the number the data supported</text>

  <!-- timeline -->
  <rect x="24" y="66" width="240" height="46" rx="9" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="36" y="86" class="lbl">Aug 5 &#183; 0.6 &#183; placeholder</text>
  <text x="36" y="103" class="small">a guess, halt ratio 0.5</text>
  <rect x="300" y="66" width="240" height="46" rx="9" fill="#FAECE7" stroke="#F0997B"/>
  <text x="312" y="86" class="lbl" style="fill:#993C1D">Aug 6 &#183; 0.3 &#183; the spec's value</text>
  <text x="312" y="103" class="small">assumed "tiny scores low"</text>
  <rect x="576" y="66" width="240" height="46" rx="9" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="588" y="86" class="lbl" style="fill:#0F6E56">Aug 9 &#183; 0.6 &#183; measured</text>
  <text x="588" y="103" class="small">from 771 real segments</text>
  <g stroke="#5F5E5A" stroke-width="1.5" fill="#5F5E5A">
    <line x1="264" y1="89" x2="292" y2="89"/><polygon points="298,89 290,85 290,93" stroke="none"/>
    <line x1="540" y1="89" x2="568" y2="89"/><polygon points="574,89 566,85 566,93" stroke="none"/>
  </g>

  <!-- chart -->
  <text x="24" y="148" class="lbl">segments below threshold, 771 from 10 calls (tiny)</text>
  <line x1="200" y1="158" x2="200" y2="262" stroke="#D3D1C7" stroke-width="1"/>

  <text x="188" y="178" class="body" text-anchor="end">below 0.3</text>
  <text x="188" y="214" class="body" text-anchor="end">below 0.5</text>
  <text x="188" y="250" class="body" text-anchor="end">below 0.6</text>

  <!-- 0.3: empty -->
  <text x="208" y="178" class="lbl">0 (0.0%)</text>
  <text x="280" y="178" class="bad">never fires: dead code</text>
  <!-- 0.5: 12 -->
  <rect x="200" y="198" width="48" height="24" fill="#85B7EB"/>
  <text x="256" y="214" class="lbl">12 (1.6%)</text>
  <text x="340" y="214" class="small">one file only</text>
  <!-- 0.6: 54 -->
  <rect x="200" y="234" width="216" height="24" fill="#2C6BC4"/>
  <text x="424" y="250" class="lbl">54 (7.0%)</text>
  <text x="500" y="250" class="small">8 of 10 calls: 0 &#183; sample_02: 32 &#183; sample_10: 22</text>

  <text x="24" y="296" class="small">confidence: min 0.412 &#183; mean 0.750 &#183; max 0.924</text>
  <text x="24" y="312" class="small">bar length is the count of segments, drawn from 0</text>
</svg>
