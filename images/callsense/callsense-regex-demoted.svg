<svg viewBox="0 0 840 366" width="840" height="366" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The regex demoted to a fallback in scan_text</title>
  <desc>Two panels compare scan_text before and after 4 November 2026. Before, the 22 regexes decide first: a match blocks and Jev is not asked, and only text with no match goes to Jev. After, a regex match is reported but Jev scores every text and decides the verdict, and the regex decides only if Jev fails or has no key. Under each panel are two tiles. Recall on our in-domain injections is 29 of 29 in both, 20 on dev and 9 on test. Hard negatives flagged fall from 10 of 35 to 4 of 35, across dev and test, in call context. A footer notes that the pipeline itself still runs the regexes alone.</desc>

  <rect x="0" y="0" width="840" height="366" fill="#FFFFFF"/>

  <style>
    .title  { font-size: 17px; font-weight: 700; fill: #1A1A18; }
    .sub    { font-size: 12px; fill: #5F5E5A; }
    .lbl    { font-size: 12px; font-weight: 600; fill: #1A1A18; }
    .small  { font-size: 10.5px; fill: #5F5E5A; }
    .body   { font-size: 11.5px; fill: #1A1A18; }
    .big    { font-size: 22px; font-weight: 700; fill: #993C1D; }
  </style>

  <text x="24" y="32" class="title">The regex, demoted to a fallback</text>
  <text x="24" y="51" class="sub">scan_text, in call context, our 69 cases (dev and test together)</text>

  <!-- panels -->
  <rect x="24" y="66" width="386" height="170" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="430" y="66" width="386" height="170" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text x="40" y="90" class="lbl">before (Oct 30): regex first</text>
  <text x="446" y="90" class="lbl">after (Nov 4): Jev decides</text>

  <!-- LEFT -->
  <rect x="40" y="108" width="100" height="40" rx="8" fill="#FAECE7" stroke="#F0997B"/>
  <text x="90" y="125" class="lbl" text-anchor="middle" style="fill:#993C1D">22 regexes</text>
  <text x="90" y="140" class="small" text-anchor="middle">decide first</text>

  <rect x="250" y="108" width="140" height="40" rx="8" fill="#FAECE7" stroke="#F0997B"/>
  <text x="320" y="125" class="lbl" text-anchor="middle" style="fill:#993C1D">block</text>
  <text x="320" y="140" class="small" text-anchor="middle">Jev is not asked</text>

  <rect x="40" y="176" width="100" height="40" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
  <text x="90" y="200" class="lbl" text-anchor="middle" style="fill:#534AB7">Jev</text>

  <rect x="250" y="176" width="140" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="320" y="200" class="lbl" text-anchor="middle">pass / review / block</text>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="#5F5E5A">
    <line x1="140" y1="128" x2="244" y2="128"/><polygon points="249,128 242,124 242,132" stroke="none"/>
    <line x1="90" y1="148" x2="90" y2="170"/><polygon points="90,175 86,168 94,168" stroke="none"/>
    <line x1="140" y1="196" x2="244" y2="196"/><polygon points="249,196 242,192 242,200" stroke="none"/>
  </g>
  <text x="194" y="122" class="small" text-anchor="middle">match</text>
  <text x="98" y="166" class="small">no match</text>

  <!-- RIGHT -->
  <rect x="446" y="108" width="100" height="40" rx="8" fill="#FAECE7" stroke="#F0997B"/>
  <text x="496" y="125" class="lbl" text-anchor="middle" style="fill:#993C1D">22 regexes</text>
  <text x="496" y="140" class="small" text-anchor="middle">reported only</text>

  <rect x="586" y="108" width="70" height="40" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
  <text x="621" y="132" class="lbl" text-anchor="middle" style="fill:#534AB7">Jev</text>

  <rect x="690" y="108" width="110" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="745" y="125" class="lbl" text-anchor="middle">pass / review</text>
  <text x="745" y="140" class="lbl" text-anchor="middle">/ block</text>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="#5F5E5A">
    <line x1="546" y1="128" x2="580" y2="128"/><polygon points="585,128 578,124 578,132" stroke="none"/>
    <line x1="656" y1="128" x2="684" y2="128"/><polygon points="689,128 682,124 682,132" stroke="none"/>
  </g>
  <polyline points="496,148 496,184 745,184 745,156" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="745,149 741,157 749,157" fill="#5F5E5A"/>
  <text x="620" y="204" class="small" text-anchor="middle">only if Jev fails or has no key, a regex match blocks</text>

  <!-- stat tiles -->
  <rect x="24" y="250" width="186" height="64" rx="8" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="38" y="278" class="big" style="fill:#0F6E56">29/29</text>
  <text x="38" y="297" class="small">recall (dev 20 + test 9)</text>
  <rect x="224" y="250" width="186" height="64" rx="8" fill="#FAECE7" stroke="#F0997B"/>
  <text x="238" y="278" class="big">10</text>
  <text x="238" y="297" class="small">hard negatives flagged (of 35)</text>

  <rect x="430" y="250" width="186" height="64" rx="8" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="444" y="278" class="big" style="fill:#0F6E56">29/29</text>
  <text x="444" y="297" class="small">recall (dev 20 + test 9)</text>
  <rect x="630" y="250" width="186" height="64" rx="8" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="644" y="278" class="big" style="fill:#0F6E56">4</text>
  <text x="644" y="297" class="small">hard negatives flagged (of 35)</text>

  <!-- footer -->
  <rect x="24" y="326" width="792" height="28" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="420" y="344" class="body" text-anchor="middle"><tspan font-weight="700">pipeline: still regex only.</tspan> This change is in scan_text, not in the graph.</text>
</svg>
