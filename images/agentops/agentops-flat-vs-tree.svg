<svg viewBox="0 0 800 430" width="800" height="430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Logs are flat; traces are trees — the parent-child pointer is the whole difference</title>
  <desc>Two panels. Left, logging: a flat list of timestamped events — query received, LLM call ok, response sent, no errors. Nothing in the list says which agent ran or what the model actually saw, so it can only answer "did X happen?". Right, observability: the same request as one parent-child run tree — a chain run for the support graph containing an llm run for classify_intent with 87 to 3 tokens, then a chain run for escalation_agent containing an llm run with 235 to 103 tokens, and a dashed empty slot where a retriever run would be. The absent retriever run is the evidence that this request never did retrieval, so the tree can answer "why did this request fail?". The takeaway: the parent-child pointer is what lets you attribute a failure to a step rather than to a request.</desc>

  <rect x="0" y="0" width="800" height="430" fill="#FFFFFF"/>

  <defs>
    <marker id="ahBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2C6BC4"/>
    </marker>
  </defs>

  <style>
    .h    { font-size: 17px; font-weight: 700; fill: #1A1A18; }
    .pt   { font-size: 13px; font-weight: 700; }
    .node { font-size: 12px; font-weight: 700; }
    .mono { font-size: 10.5px; font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #444441; }
    .monob{ font-size: 10.5px; font-weight: 700; font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .sub  { font-size: 10px; fill: #5F5E5A; }
    .miss { font-size: 12px; font-weight: 700; fill: #993C1D; }
    .cap  { font-size: 11.5px; fill: #5F5E5A; }
    .tag  { font-size: 12px; font-weight: 700; }
  </style>

  <text x="24" y="32" class="h">Logs are flat; traces are trees</text>

  <!-- ===== Panel 1: logging ===== -->
  <rect x="24" y="52" width="366" height="296" rx="14" fill="#FBFBF9" stroke="#E4E2DA"/>
  <text x="44" y="80" class="pt" fill="#8A6D1F">Logging &#8212; flat events</text>

  <rect x="44" y="94" width="326" height="128" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="60" y="118" class="mono">12:04:01  INFO   query received</text>
  <text x="60" y="140" class="mono">12:04:01  INFO   llm call ok        200</text>
  <text x="60" y="162" class="mono">12:04:03  INFO   response sent      200</text>
  <text x="60" y="184" class="mono">&#8212;  no warnings, no errors  &#8212;</text>
  <text x="60" y="208" class="sub">every line is a sibling; none points to another</text>

  <text x="44" y="252" class="miss">&#10007; nothing says which agent ran</text>
  <text x="44" y="274" class="sub">&#8212; or what the model actually saw</text>
  <text x="44" y="312" class="cap">answers: <tspan font-weight="700" fill="#1A1A18">&#8220;did X happen?&#8221;</tspan></text>

  <!-- ===== Panel 2: trace tree ===== -->
  <rect x="410" y="52" width="366" height="296" rx="14" fill="#FBFBF9" stroke="#E4E2DA"/>
  <text x="430" y="80" class="pt" fill="#1F4E79">Observability &#8212; one request, one tree</text>

  <!-- root -->
  <rect x="430" y="92" width="326" height="30" rx="8" fill="#E6F1FB" stroke="#85B7EB"/>
  <text x="444" y="112" class="monob" fill="#1F4E79">chain  support_graph</text>
  <text x="742" y="112" text-anchor="end" class="sub">2.0s</text>

  <!-- child 1 -->
  <rect x="452" y="130" width="304" height="30" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
  <text x="466" y="150" class="monob" fill="#3C3489">llm  classify_intent</text>
  <text x="742" y="150" text-anchor="end" class="sub">87 &#8594; 3 tok</text>

  <!-- child 2 -->
  <rect x="452" y="168" width="304" height="30" rx="8" fill="#E6F1FB" stroke="#85B7EB"/>
  <text x="466" y="188" class="monob" fill="#1F4E79">chain  escalation_agent</text>

  <!-- grandchild -->
  <rect x="474" y="206" width="282" height="30" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
  <text x="488" y="226" class="monob" fill="#3C3489">llm  escalate</text>
  <text x="742" y="226" text-anchor="end" class="sub">235 &#8594; 103 tok</text>

  <!-- absent retriever -->
  <rect x="474" y="244" width="282" height="30" rx="8" fill="#FFFFFF" stroke="#C4694A" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="488" y="264" class="monob" fill="#993C1D">retriever  &#8212; not present</text>

  <!-- tree spine -->
  <path d="M 440 122 L 440 145 L 450 145" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
  <path d="M 440 122 L 440 183 L 450 183" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
  <path d="M 462 198 L 462 221 L 472 221" fill="none" stroke="#B4B2A9" stroke-width="1.4"/>
  <path d="M 462 198 L 462 259 L 472 259" fill="none" stroke="#B4B2A9" stroke-width="1.4" stroke-dasharray="4 3"/>

  <text x="430" y="298" class="miss">&#10007; no retriever run &#8594; it never did RAG</text>
  <text x="430" y="330" class="cap">answers: <tspan font-weight="700" fill="#1A1A18">&#8220;why did THIS request fail?&#8221;</tspan></text>

  <!-- ===== takeaway ===== -->
  <rect x="24" y="364" width="752" height="50" rx="12" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="400" y="388" text-anchor="middle" class="tag" fill="#0F6E56">The parent-child pointer is the entire difference</text>
  <text x="400" y="406" text-anchor="middle" class="sub">it lets you attribute a failure to a <tspan font-weight="700" fill="#1A1A18">step</tspan>, not just to a request</text>
</svg>
