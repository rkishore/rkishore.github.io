<svg viewBox="0 0 800 420" width="800" height="420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The output cost floor — why halving the prompt didn't halve the bill</title>
  <desc>Two stacked bars, one above the other. The baseline bar, built with chunk size 1000 and top k of 5, is mostly a long pale block of prompt tokens — the big, cheap pile — ending in a short dark block of completion tokens, the small pile that is priced roughly four to five times higher per token. An arrow labeled "trim the retrieved context: chunk 1000 to 400, k 5 to 3" leads down to the optimized bar, where the prompt block has shrunk dramatically while the completion block is exactly the same width as before. A bracket under the unchanged completion block marks it as the floor that input savings cannot cross. Two number chips report the result: prompt tokens fell 52.9 percent, but cost fell only 48.5 percent. The caption explains that the gap between those two percentages is the output floor made visible — percentage saved on tokens is not percentage saved on dollars.</desc>

  <rect x="0" y="0" width="800" height="420" fill="#FFFFFF"/>

  <defs>
    <marker id="ahBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2C6BC4"/>
    </marker>
  </defs>

  <style>
    .h    { font-size: 17px; font-weight: 700; fill: #1A1A18; }
    .lbl  { font-size: 12.5px; font-weight: 700; }
    .sub  { font-size: 10.5px; fill: #5F5E5A; }
    .mono { font-size: 11px; font-weight: 700; font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .cap  { font-size: 11.5px; fill: #5F5E5A; }
    .big  { font-size: 20px; font-weight: 700; }
    .tag  { font-size: 12px; font-weight: 700; }
  </style>

  <text x="24" y="32" class="h">The output floor</text>

  <!-- ===== baseline bar ===== -->
  <text x="24" y="68" class="lbl" fill="#5F5E5A">BASELINE</text>
  <text x="110" y="68" class="mono" fill="#5F5E5A">chunk=1000, k=5</text>

  <rect x="24" y="80" width="600" height="46" rx="8" fill="#E6F1FB" stroke="#85B7EB"/>
  <rect x="624" y="80" width="120" height="46" rx="8" fill="#3C3489"/>
  <text x="324" y="109" text-anchor="middle" class="lbl" fill="#1F4E79">prompt tokens &#8212; the big, cheap pile</text>
  <text x="684" y="103" text-anchor="middle" class="tag" fill="#FFFFFF">completion</text>
  <text x="684" y="118" text-anchor="middle" class="sub" fill="#D9D7EE">priced ~4&#8211;5&#215;</text>

  <!-- arrow -->
  <line x1="324" y1="132" x2="324" y2="176" stroke="#2C6BC4" stroke-width="2" marker-end="url(#ahBlue)"/>
  <text x="344" y="158" class="mono" fill="#1F4E79">trim the retrieved context &#8212; chunk 1000&#8594;400, k 5&#8594;3</text>

  <!-- ===== optimized bar ===== -->
  <text x="24" y="204" class="lbl" fill="#0F6E56">OPTIMIZED</text>
  <text x="120" y="204" class="mono" fill="#0F6E56">chunk=400, k=3</text>

  <rect x="24" y="216" width="283" height="46" rx="8" fill="#E1F5EE" stroke="#5DCAA5"/>
  <rect x="624" y="216" width="120" height="46" rx="8" fill="#3C3489"/>
  <text x="165" y="245" text-anchor="middle" class="lbl" fill="#0F6E56">prompt tokens</text>
  <text x="684" y="239" text-anchor="middle" class="tag" fill="#FFFFFF">completion</text>
  <text x="684" y="254" text-anchor="middle" class="sub" fill="#D9D7EE">unchanged</text>

  <!-- ghost of the old prompt block -->
  <rect x="307" y="216" width="317" height="46" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="5 4"/>
  <text x="465" y="245" text-anchor="middle" class="sub">what the trim removed</text>

  <!-- floor bracket -->
  <path d="M 624 270 L 624 282 L 744 282 L 744 270" fill="none" stroke="#993C1D" stroke-width="1.8"/>
  <text x="684" y="300" text-anchor="middle" class="tag" fill="#993C1D">the floor</text>
  <text x="684" y="316" text-anchor="middle" class="sub">input savings can't cross it</text>

  <!-- ===== numbers ===== -->
  <rect x="24" y="330" width="300" height="70" rx="12" fill="#FBFBF9" stroke="#E4E2DA"/>
  <text x="44" y="360" class="big" fill="#0F6E56">&#8722;52.9%</text>
  <text x="150" y="356" class="cap">prompt tokens</text>
  <text x="150" y="374" class="sub">the pile you actually cut</text>

  <rect x="344" y="330" width="300" height="70" rx="12" fill="#FBFBF9" stroke="#E4E2DA"/>
  <text x="364" y="360" class="big" fill="#993C1D">&#8722;48.5%</text>
  <text x="470" y="356" class="cap">dollars</text>
  <text x="470" y="374" class="sub">what the bill actually did</text>

  <text x="664" y="356" class="tag" fill="#1A1A18">the gap</text>
  <text x="664" y="374" class="sub">is the floor,</text>
  <text x="664" y="390" class="sub">made visible</text>
</svg>
